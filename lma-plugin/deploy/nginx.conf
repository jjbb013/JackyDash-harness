# LMA 单域名部署（Nginx 版）——证书用 certbot 签发
#
#   https://<域名>/login       → 站点首页登录页（插件，3081，匿名）
#   https://<域名>/api/auth/*  → 登录 / 鉴权探针（插件，3081，匿名）
#   https://<域名>/            → 聊天 UI（dsh web，3080，**登录后**）
#   https://<域名>/lma/        → LMA 仪表盘（插件，3081，**登录后，不再二次登录**）
#   https://<域名>/lma/unsubscribe → 邮件退订端点（匿名，token 即凭证）
#
# 用法：
#   1) cp deploy/nginx.conf /etc/nginx/conf.d/lma.conf
#   2) 把 server_name 换成你的域名（install.sh 会自动替换）
#   3) certbot --nginx -d <域名>      # 自动填 ssl_certificate 两行
#   4) nginx -t && systemctl reload nginx
#
# 鉴权分工：nginx 用 auth_request 探插件的 /api/auth/verify，2xx 放行；401 由
# `error_page 401 = @lma_unauthorized` 决定是跳登录页（页面导航）还是原样回 401（接口调用）。

# WebSocket 升级映射（必须在 http 上下文里；conf.d/*.conf 正好在 http 内）
map $http_upgrade $connection_upgrade {
	default upgrade;
	''      close;
}

# 未登录时的落点：页面导航 → 登录页并带上原地址；接口调用 → 空（回 401，
# 免得把登录页 HTML 喂给前端 response.json()）
map $http_accept $lma_login_target {
	default       "";
	"~*text/html" "/login?next=$request_uri";
}

server {
	listen 80;
	listen [::]:80;
	server_name jackydash.will-pan.com;
	return 301 https://$host$request_uri;
}

server {
	listen 443 ssl;
	listen [::]:443 ssl;
	http2 on;
	server_name jackydash.will-pan.com;

	# certbot --nginx 会自动补上这两行
	# ssl_certificate     /etc/letsencrypt/live/<域名>/fullchain.pem;
	# ssl_certificate_key /etc/letsencrypt/live/<域名>/privkey.pem;

	# CSV 导入上限 5MB，留些余量
	client_max_body_size 8m;

	# ---------- 匿名：首页登录页 + 登录 / 鉴权接口 ----------
	location = /login {
		proxy_pass http://127.0.0.1:3081;
		proxy_http_version 1.1;
		proxy_set_header Host              $host;
		proxy_set_header X-Real-IP         $remote_addr;
		proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
		proxy_set_header X-Forwarded-Host  $host;
	}

	location /api/auth/ {
		proxy_pass http://127.0.0.1:3081;
		proxy_http_version 1.1;
		proxy_set_header Host              $host;
		proxy_set_header X-Real-IP         $remote_addr;
		proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
		proxy_set_header X-Forwarded-Host  $host;
	}

	# ---------- 鉴权子请求（仅内部调用，不对外暴露） ----------
	# 注意 Accept 被清空：插件据此返回 401 而不是 302 —— nginx 的 auth_request
	# 只认 401/403，收到 3xx 会当成上游错误报 500。跳转由 @lma_unauthorized 负责。
	location = /lma-auth-verify {
		internal;
		proxy_pass http://127.0.0.1:3081/api/auth/verify;
		proxy_pass_request_body off;
		proxy_set_header Content-Length "";
		proxy_set_header Accept            "";
		proxy_set_header Cookie            $http_cookie;
		proxy_set_header X-Forwarded-Uri   $request_uri;
		proxy_set_header X-Forwarded-Host  $host;
		proxy_set_header X-Forwarded-Proto $scheme;
	}

	location @lma_unauthorized {
		if ($lma_login_target = "") {
			return 401;
		}
		return 302 $lma_login_target;
	}

	# ---------- 邮件退订端点：**绝不能加鉴权** ----------
	# 收件人没有账号，token 本身就是凭证。单独精确匹配，免得被下面仪表盘那段的
	# auth_request 挡掉。
	location = /lma/unsubscribe {
		# 带 URI 的 proxy_pass 会把匹配到的前缀换掉，正好剥去 /lma；
		# 查询串默认透传（proxy_pass 的 URI 里没有 ? 时）
		proxy_pass http://127.0.0.1:3081/unsubscribe;
		proxy_http_version 1.1;
		proxy_set_header Host              $host;
		proxy_set_header X-Real-IP         $remote_addr;
		proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
	}

	# ---------- LMA 仪表盘：/lma/ ----------
	# 缺尾斜杠先补齐：仪表盘用相对路径，少了斜杠会把 api/xxx 解析到根路径
	location = /lma { return 301 /lma/; }

	location /lma/ {
		auth_request /lma-auth-verify;
		error_page 401 = @lma_unauthorized;

		# 末尾的 / 会把 /lma/ 前缀剥掉，插件内部看到的仍是 /
		proxy_pass http://127.0.0.1:3081/;
		proxy_http_version 1.1;
		proxy_set_header Host              $host;
		proxy_set_header X-Real-IP         $remote_addr;
		proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
	}

	# ---------- 聊天 UI：/ ----------
	location / {
		auth_request /lma-auth-verify;
		error_page 401 = @lma_unauthorized;

		proxy_pass http://127.0.0.1:3080;
		proxy_http_version 1.1;
		# 聊天流式输出走 SSE/WebSocket，这几行不能少
		proxy_set_header Upgrade           $http_upgrade;
		proxy_set_header Connection        $connection_upgrade;
		proxy_set_header Host              $host;
		proxy_set_header X-Real-IP         $remote_addr;
		proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
		proxy_buffering off;
		proxy_read_timeout 3600s;
		proxy_send_timeout 3600s;
	}
}
