# LMA 单域名部署（Nginx 版）——证书用 certbot 签发
#
#   https://<域名>/       → 聊天 UI（dsh web，3080）
#   https://<域名>/lma/   → LMA 仪表盘（插件，3081）
#
# 用法：
#   1) cp deploy/nginx.conf /etc/nginx/conf.d/lma.conf
#   2) 把 server_name 换成你的域名（install.sh 会自动替换）
#   3) certbot --nginx -d <域名>      # 自动填 ssl_certificate 两行
#   4) nginx -t && systemctl reload nginx

# WebSocket 升级映射（必须在 http 上下文里；conf.d/*.conf 正好在 http 内）
map $http_upgrade $connection_upgrade {
	default upgrade;
	''      close;
}

server {
	listen 80;
	listen [::]:80;
	server_name jackydash.will-pan.com;
	return 301 https://$host$request_uri;
}

server {
	listen 443 ssl;
	listen [::]:443 ssl;
	http2 on;
	server_name jackydash.will-pan.com;

	# certbot --nginx 会自动补上这两行
	# ssl_certificate     /etc/letsencrypt/live/<域名>/fullchain.pem;
	# ssl_certificate_key /etc/letsencrypt/live/<域名>/privkey.pem;

	# CSV 导入上限 5MB，留些余量
	client_max_body_size 8m;

	# ---------- LMA 仪表盘：/lma/ ----------
	# 缺尾斜杠先补齐：仪表盘用相对路径，少了斜杠会把 api/xxx 解析到根路径
	location = /lma { return 301 /lma/; }

	location /lma/ {
		# 末尾的 / 会把 /lma/ 前缀剥掉，插件内部看到的仍是 /
		proxy_pass http://127.0.0.1:3081/;
		proxy_http_version 1.1;
		proxy_set_header Host              $host;
		proxy_set_header X-Real-IP         $remote_addr;
		proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
	}

	# ⚠️ 邮件退订端点走的就是 /lma/unsubscribe，**绝不能给它加鉴权**，
	#    否则收件人点开是 401（token 本身就是凭证）。

	# ---------- 聊天 UI：/ ----------
	location / {
		proxy_pass http://127.0.0.1:3080;
		proxy_http_version 1.1;
		# 聊天流式输出走 SSE/WebSocket，这几行不能少
		proxy_set_header Upgrade           $http_upgrade;
		proxy_set_header Connection        $connection_upgrade;
		proxy_set_header Host              $host;
		proxy_set_header X-Real-IP         $remote_addr;
		proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
		proxy_buffering off;
		proxy_read_timeout 3600s;
		proxy_send_timeout 3600s;
	}
}
